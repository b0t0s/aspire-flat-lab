  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    labels:
    - glance.hide=true
    command: hbbs
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21115:21115"
    - "21116:21116"
    - "21116:21116/udp"
    - "21118:21118"
    networks:
    - flat_lab_net

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    command: hbbr
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21117:21117"
    - "21119:21119"
    networks:
    - flat_lab_net

  ntfy:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Notifications
    - homepage.icon=mdi-bell-ring
    - homepage.href=https://notifications.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=ntfy
    - homepage.widget.url=http://ntfy:80
    - homepage.widget.topic=${NTFY_WIDGET_TOPIC:-general}
    - homepage.widget.username={{HOMEPAGE_VAR_NTFY_WIDGET_USERNAME}}
    - homepage.widget.password={{HOMEPAGE_VAR_NTFY_WIDGET_PASSWORD}}
    image: binwiederhier/ntfy:latest
    container_name: notifications
    restart: unless-stopped
    command: serve
    environment:
    - TZ=${TZ:-Europe/Kyiv}
    - NTFY_BASE_URL=https://notifications.${DUCKDNS_DOMAIN:-localhost}
    - NTFY_AUTH_DEFAULT_ACCESS=read-write
    - NTFY_ENABLE_LOGIN=true
    - NTFY_BEHIND_PROXY=true
    volumes:
    - ${NTFY_AUTH:-../services-data/system/ntfy/auth}:/var/lib/ntfy
    - ./configs/ntfy:/etc/ntfy:ro
    - ${NTFY_CACHE:-../services-data/system/ntfy/cache}:/var/cache/ntfy
    ports:
    - "10010:80"
    networks:
    - flat_lab_net

  minecraft:
    labels:
    - homepage.group=Entertainment
    - homepage.name=minecraft
    - homepage.icon=mdi-minecraft
    - homepage.description=Game server
    - homepage.widget.type=minecraft
    - homepage.widget.url=udp://minecraft:25565
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    ports:
    - "25565:25565"
    environment:
    - EULA=TRUE
    - TYPE=PAPER
    - DIFFICULTY=hard
    - LEVEL_TYPE=AMPLIFIED
    - ICON=/data/server-icon.png
    - OVERRIDE_ICON=true
    - ENABLE_RCON=false
    - ONLINE_MODE=false
    - MEMORY=2G
    - MOTD=Flat-lab
    volumes:
    - ./configs/minecraft:/config:ro
    - ${MINECRAFT_DATA:-../services-data/system/minecraft}:/data
    networks:
    - flat_lab_net

networks:
  flat_lab_net:
    name: flat_lab_net
    external: true
