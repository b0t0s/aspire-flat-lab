services:
  zerotier-init:
    image: alpine:latest
    container_name: zerotier-init
    restart: "no"
    volumes:
    - ${ZEROTIER_DATA_PATH:-../services-data/system/zerotier}:/var/lib/zerotier-one
    entrypoint: /bin/sh
    command:
    - -c
    - |
      if [ ! -f /var/lib/zerotier-one/local.conf ]; then
        echo "Configuring zerotier-one to listen on all interfaces..."
        printf '{"settings":{"tcpListenAddress":"0.0.0.0:9993"}}\n' > /var/lib/zerotier-one/local.conf
        echo "local.conf written."
      else
        echo "local.conf already exists. Skipping."
      fi

  zerotier:
    build:
      context: ./src/additional-software/zerotier
      dockerfile: Dockerfile
    container_name: zerotier
    restart: unless-stopped
    labels:
    - glance.hide=true
    cap_add:
    - NET_ADMIN
    - SYS_ADMIN
    devices:
    - /dev/net/tun
    volumes:
    - ${ZEROTIER_DATA_PATH:-../services-data/system/zerotier}:/var/lib/zerotier-one
    environment:
    - ZEROTIER_NETWORK_ID=${ZEROTIER_NETWORK_ID:?set ZEROTIER_NETWORK_ID in .env}
    networks:
    - flat_lab_net
    depends_on:
      zerotier-init:
        condition: service_completed_successfully

  caddy:
    labels:
    - glance.hide=true
    build:
      context: ./src/containers/caddy
      dockerfile: Dockerfile
    container_name: caddy
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    environment:
    - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in .env}
    - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:?set DUCKDNS_DOMAIN in .env}
    volumes:
    - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile
    - ../services-data/system/caddy/data:/data
    - ../services-data/system/caddy/config:/config
    networks:
    - flat_lab_net
    extra_hosts:
    - "host.docker.internal:host-gateway"

  cpm:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Caddy UI
    - homepage.icon=mdi-sign-direction
    - homepage.href=https://caddyui.${DUCKDNS_DOMAIN:-localhost}
    image: perteus/caddy-ui:latest
    container_name: cpm
    restart: unless-stopped
    environment:
    - CONTAINER_NAME=caddy
    - CADDY_CONFIG_PATH=/caddy-config
    - CADDY_DATA_PATH=/caddy-data
    ports:
    - "10056:8501"
    volumes:
    - ./configs/caddy/Caddyfile:/caddy-config/Caddyfile:ro
    - ${CPM_DATA:-../services-data/system/caddy/data}:/caddy-data
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - flat_lab_net

  adguardhome:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=AdGuard
    - homepage.icon=mdi-shield-check
    - homepage.description=DNS sinkhole
    - homepage.href=https://adguard.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=adguard
    - homepage.widget.url=https://adguard.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.username={{HOMEPAGE_VAR_ADGUARD_WIDGET_USERNAME}}
    - homepage.widget.password={{HOMEPAGE_VAR_ADGUARD_WIDGET_PASSWORD}}
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
    - ${ADGUARD_WORKDIR:-../services-data/system/adguardhome/workdir}:/opt/adguardhome/work
    - ${ADGUARD_CONFDIR:-../services-data/system/adguardhome/confdir}:/opt/adguardhome/conf
    ports:
    - "53:53/tcp"
    - "53:53/udp"
    - "10002:81/tcp"
    - "10001:3000/tcp"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${DUCKDNS_DOMAIN:-localhost}
    networks:
    - flat_lab_net

  homepage:
    labels:
    - glance.hide=true
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
    - HOMEPAGE_MCP_TOKEN=${HOMEPAGE_MCP_TOKEN:-}
    - HOMEPAGE_MCP_ENABLED=${HOMEPAGE_MCP_ENABLED:-false}
    - HOMEPAGE_AUTH_ENABLED=${HOMEPAGE_AUTH_ENABLED:-false}
    - HOMEPAGE_MCP_ALLOW_WRITE=${HOMEPAGE_MCP_ALLOW_WRITE:-false}
    - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-homepage.${DUCKDNS_DOMAIN:-localhost},localhost,127.0.0.1}
    # Look & header widgets:
    - HOMEPAGE_VAR_TITLE=${HOMEPAGE_TITLE:-flat-lab}
    - HOMEPAGE_VAR_THEME=${HOMEPAGE_THEME:-dark}
    - HOMEPAGE_VAR_COLOR=${HOMEPAGE_COLOR:-slate}
    - HOMEPAGE_VAR_HEADER_STYLE=${HOMEPAGE_HEADER_STYLE:-boxed}
    - HOMEPAGE_VAR_CARD_STYLE=${HOMEPAGE_CARD_STYLE:-}
    - HOMEPAGE_VAR_BLOCK_STYLE=${HOMEPAGE_BLOCK_STYLE:-}
    - HOMEPAGE_VAR_FONT=${HOMEPAGE_FONT:-}
    - HOMEPAGE_VAR_DOMAIN=${DUCKDNS_DOMAIN}
    - HOMEPAGE_VAR_TZ=${TZ:-Europe/Kyiv}
    - HOMEPAGE_VAR_OPENMETEO_LABEL=${OPENMETEO_LABEL:-Home}
    - HOMEPAGE_VAR_OPENMETEO_LAT=${OPENMETEO_LAT:-50.45}
    - HOMEPAGE_VAR_OPENMETEO_LON=${OPENMETEO_LON:-30.52}
    # Widget credentials:
    - HOMEPAGE_VAR_BESZEL_WIDGET_USERNAME=${BESZEL_WIDGET_USERNAME:-}
    - HOMEPAGE_VAR_BESZEL_WIDGET_PASSWORD=${BESZEL_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_CHANGEDETECTION_WIDGET_KEY=${CHANGEDETECTION_WIDGET_KEY:-}
    - HOMEPAGE_VAR_KARAKEEP_WIDGET_KEY=${KARAKEEP_WIDGET_KEY:-}
    - HOMEPAGE_VAR_ADGUARD_WIDGET_USERNAME=${ADGUARD_WIDGET_USERNAME:-admin}
    - HOMEPAGE_VAR_ADGUARD_WIDGET_PASSWORD=${ADGUARD_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_HOMEASSISTANT_WIDGET_KEY=${HOMEASSISTANT_WIDGET_KEY:-}
    - HOMEPAGE_VAR_NTFY_WIDGET_USERNAME=${NTFY_WIDGET_USERNAME:-}
    - HOMEPAGE_VAR_NTFY_WIDGET_PASSWORD=${NTFY_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_CALIBRE_WIDGET_USER=${CALIBRE_WIDGET_USER:-admin}
    - HOMEPAGE_VAR_CALIBRE_WIDGET_PASSWORD=${CALIBRE_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_HOMEBOX_WIDGET_USERNAME=${HOMEBOX_WIDGET_USERNAME:-}
    - HOMEPAGE_VAR_HOMEBOX_WIDGET_PASSWORD=${HOMEBOX_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_IMMICH_WIDGET_KEY=${IMMICH_WIDGET_KEY:-}
    - HOMEPAGE_VAR_JELLYFIN_WIDGET_KEY=${JELLYFIN_WIDGET_KEY:-}
    - HOMEPAGE_VAR_KAVITA_WIDGET_USER=${KAVITA_WIDGET_USER:-admin}
    - HOMEPAGE_VAR_KAVITA_WIDGET_PASSWORD=${KAVITA_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_LIDARR_WIDGET_KEY=${LIDARR_WIDGET_KEY:-}
    - HOMEPAGE_VAR_LINKWARDEN_WIDGET_KEY=${LINKWARDEN_WIDGET_KEY:-}
    - HOMEPAGE_VAR_MINIFLUX_WIDGET_KEY=${MINIFLUX_WIDGET_KEY:-}
    - HOMEPAGE_VAR_NAVIDROME_WIDGET_USER=${NAVIDROME_WIDGET_USER:-admin}
    - HOMEPAGE_VAR_NAVIDROME_WIDGET_TOKEN=${NAVIDROME_WIDGET_TOKEN:-}
    - HOMEPAGE_VAR_NAVIDROME_WIDGET_SALT=${NAVIDROME_WIDGET_SALT:-}
    - HOMEPAGE_VAR_PAPERLESS_WIDGET_KEY=${PAPERLESS_WIDGET_KEY:-}
    - HOMEPAGE_VAR_PROWLARR_WIDGET_KEY=${PROWLARR_WIDGET_KEY:-}
    - HOMEPAGE_VAR_QBITTORRENT_WIDGET_USER=${QBITTORRENT_WIDGET_USER:-admin}
    - HOMEPAGE_VAR_QBITTORRENT_WIDGET_PASSWORD=${QBITTORRENT_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_RADARR_WIDGET_KEY=${RADARR_WIDGET_KEY:-}
    - HOMEPAGE_VAR_SONARR_WIDGET_KEY=${SONARR_WIDGET_KEY:-}
    - HOMEPAGE_VAR_WALLOS_WIDGET_KEY=${WALLOS_WIDGET_KEY:-}
    ports:
    - "10000:3000"
    volumes:
    - ../services-data/system/homepage/config:/app/config
    - ./configs/homepage/docker.yaml:/app/config/docker.yaml:ro
    - ./configs/homepage/settings.yaml:/app/config/settings.yaml:ro
    - ./configs/homepage/widgets.yaml:/app/config/widgets.yaml:ro
    - ./configs/homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
    - ./configs/homepage/themes/${HOMEPAGE_THEME_PRESET:-default}.css:/app/config/custom.css:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - flat_lab_net
    extra_hosts:
    - "host.docker.internal:host-gateway"

  ntfy:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Notifications
    - homepage.icon=mdi-bell-ring
    - homepage.href=https://notifications.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=ntfy
    - homepage.widget.url=http://ntfy:80
    - homepage.widget.topic=${NTFY_WIDGET_TOPIC:-general}
    - homepage.widget.username={{HOMEPAGE_VAR_NTFY_WIDGET_USERNAME}}
    - homepage.widget.password={{HOMEPAGE_VAR_NTFY_WIDGET_PASSWORD}}
    image: binwiederhier/ntfy:latest
    container_name: notifications
    restart: unless-stopped
    command: serve
    environment:
    - TZ=${TZ:-Europe/Kyiv}
    - NTFY_BASE_URL=https://notifications.${DUCKDNS_DOMAIN:-localhost}
    - NTFY_AUTH_DEFAULT_ACCESS=read-write
    - NTFY_ENABLE_LOGIN=true
    - NTFY_BEHIND_PROXY=true
    volumes:
    - ${NTFY_AUTH:-../services-data/system/ntfy/auth}:/var/lib/ntfy
    - ./configs/ntfy:/etc/ntfy:ro
    - ${NTFY_CACHE:-../services-data/system/ntfy/cache}:/var/cache/ntfy
    ports:
    - "10010:80"
    networks:
    - flat_lab_net

  searxng:
    labels:
    - homepage.group=Household
    - homepage.name=Search
    - homepage.icon=mdi-magnify
    - homepage.href=https://search.${DUCKDNS_DOMAIN:-localhost}
    image: searxng/searxng:latest
    container_name: search
    restart: unless-stopped
    environment:
    - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    - SEARXNG_REDIS_URL=redis://searxng-redis:6379/0
    ports:
    - "10003:8080"
    volumes:
    - ./configs/searxng:/etc/searxng
    dns:
    - "${DNS1:-}"
    - "${DNS2:-}"
    networks:
    - flat_lab_net

  searxng-redis:
    image: redis:7-alpine
    container_name: searxng-redis
    restart: unless-stopped
    volumes:
    - ${SEARXNG_REDIS_DATA:-../services-data/system/searxng/redis}:/data
    networks:
    - flat_lab_net

  filebrowser-quantum:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Files
    - homepage.icon=si-filebrowser
    - homepage.href=https://files.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=filebrowser
    - homepage.widget.url=http://filebrowser-quantum:80
    image: gtstef/filebrowser:2.0.1-stable
    container_name: files
    restart: unless-stopped
    environment:
    - FILEBROWSER_CONFIG=/config/config.yaml
    ports:
    - "10005:80"
    volumes:
    - ${FILEBROWSER_DATA:-../services-data/system/filebrowser-quantum}:/config
    - ./configs/filebrowser-quantum/config.yaml:/config/config.yaml:ro
    - ${FILEBROWSER_FILES:-../services-data/public}:/public
    networks:
    - flat_lab_net

  glances:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Monitor
    - homepage.icon=mdi-monitor-eye
    - homepage.href=https://monitor.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=glances
    - homepage.widget.url=http://monitor:61208
    - homepage.widget.version=4
    - homepage.widget.metric=info
    image: nicolargo/glances:latest
    container_name: monitor
    restart: unless-stopped
    pid: host
    privileged: true
    environment:
    - GLANCES_OPT=-w
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ${GLANCES_DATA_PATH:-../services-data/system/glances}:/glances/conf
    ports:
    - "10006:61208"
    networks:
    - flat_lab_net

  # netalertx:
  #   labels:
  #   - homepage.group=Infrastructure
  #   - homepage.name=Network
  #   - homepage.icon=mdi-network
  #   - homepage.href=https://network.${DUCKDNS_DOMAIN:-localhost}
  #   - homepage.widget.type=netalertx
  #   - homepage.widget.url=http://netalertx:20211
  #   image: jokobsk/netalertx:latest
  #   container_name: network
  #   restart: unless-stopped
  #   network_mode: host
  #   privileged: true
  #   tmpfs:
  #   - /tmp:rw,nosuid,nodev,size=256m
  #   environment:
  #   - TZ=${TZ:-Europe/Kyiv}
  #   - GR_TZ=${TZ:-Europe/Kyiv}
  #   volumes:
  #   - ${NETALERTX_DATA_PATH:-../services-data/system/netalertx}:/data

  home-assistant:
    labels:
    - homepage.group=Household
    - homepage.name=Home Assistant
    - homepage.icon=mdi-home-automation
    - homepage.href=https://home-assistant.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=homeassistant
    - homepage.widget.url=http://host.docker.internal:8123
    - homepage.widget.key={{HOMEPAGE_VAR_HOMEASSISTANT_WIDGET_KEY}}
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    privileged: true
    network_mode: host
    cap_add:
    - NET_ADMIN
    - NET_RAW
    volumes:
    - ${HOME_ASSISTANT_DATA:-../services-data/system/home-assistant}:/config
    - ./configs/home-assistant/configuration.yaml:/config/configuration.yaml:ro
    - /etc/localtime:/etc/localtime:ro
    - /run/dbus:/run/dbus:ro
    environment:
    - TZ=${TZ:-Europe/Kyiv}

  seafile:
    labels:
    - homepage.group=Household
    - homepage.name=Cloud
    - homepage.icon=mdi-cloud
    - homepage.href=https://cloud.${DUCKDNS_DOMAIN:-localhost}
    image: seafileltd/seafile-mc:latest
    container_name: cloud
    restart: unless-stopped
    ports:
      - "10008:80"
    environment:
      - DB_HOST=seafile-db
      - TIME_ZONE=Europe/Kyiv
      - SEAFILE_SERVER_LETSENCRYPT=false
      - SEAFILE_SERVER_HOSTNAME=${DUCKDNS_DOMAIN:-localhost}
      - DB_ROOT_PASSWD=${SEAFILE_DB_ROOT_PASS:?set SEAFILE_DB_ROOT_PASS in .env}
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL:?set SEAFILE_ADMIN_EMAIL in .env}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASS:?set SEAFILE_ADMIN_PASS in .env}
    volumes:
    - ${SEAFILE_DATA:-../services-data/system/seafile}:/shared
    depends_on:
      - seafile-db
      - seafile-memcached
    networks:
      - flat_lab_net
      
  seafile-db:
    image: mariadb:11.8.8
    container_name: seafile-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASS:?set SEAFILE_DB_ROOT_PASS in .env}
      - MYSQL_LOG_CONSOLE=true
      - DEBUG=True
    volumes:
      - ${SEAFILE_DB_DATA:-../services-data/system/seafile-db}:/var/lib/mysql
    networks:
      - flat_lab_net

  seafile-memcached:
    image: memcached:1.6-alpine
    container_name: seafile-memcached
    restart: unless-stopped
    entrypoint: memcached -m 256
    networks:
      - flat_lab_net

  seafile-auto-config:
    image: docker:cli
    container_name: seafile-auto-config
    restart: "no"
    environment:
    - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:-localhost}
    volumes:
    - ${SEAFILE_DATA:-../services-data/system/seafile}:/shared
    - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/sh
    command:
    - -c
    - |
      CFG=/shared/seafile/conf/seahub_settings.py
      for i in $$(seq 1 100); do [ -f "$$CFG" ] && break; sleep 3; done
      [ -f "$$CFG" ] || { echo "seahub_settings.py not found, giving up"; exit 1; }
      sleep 5
      sed -i "s|'LOCATION': 'memcached:11211'|'LOCATION': 'seafile-memcached:11211'|" "$$CFG"
      if ! grep -q CSRF_TRUSTED_ORIGINS "$$CFG"; then
        printf "\nSERVICE_URL = 'https://cloud.%s'\nFILE_SERVER_ROOT = 'https://cloud.%s/seafhttp'\nCSRF_TRUSTED_ORIGINS = ['https://cloud.%s']\nSECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')\n" "$$DUCKDNS_DOMAIN" "$$DUCKDNS_DOMAIN" "$$DUCKDNS_DOMAIN" >> "$$CFG"
        docker restart cloud
      fi
    depends_on:
      - seafile

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
    - LOG_LEVEL=info
    ports:
    - "10009:8191"
    networks:
    - flat_lab_net

  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    labels:
    - glance.hide=true
    command: hbbs
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21115:21115"
    - "21116:21116"
    - "21116:21116/udp"
    - "21118:21118"
    networks:
    - flat_lab_net

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    command: hbbr
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21117:21117"
    - "21119:21119"
    networks:
    - flat_lab_net

  dockflare:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=DockFlare
    - homepage.icon=mdi-cloud
    - homepage.href=https://dockflare.${DUCKDNS_DOMAIN:-localhost}
    image: alplat/dockflare:stable
    container_name: dockflare
    restart: unless-stopped
    environment:
    - REDIS_URL=redis://dockflare-redis:6379/0
    - DOCKER_HOST=tcp://docker-socket-proxy:2375
    - INTERNAL_BOOTSTRAP_SECRET=${DOCKFLARE_INTERNAL_BOOTSTRAP_SECRET:?set DOCKFLARE_INTERNAL_BOOTSTRAP_SECRET in .env}
    volumes:
    - ${DOCKFLARE_DATA:-../services-data/system/dockflare}:/app/data
    ports:
    - "10020:5000"
    depends_on:
    - dockflare-redis
    - docker-socket-proxy
    networks:
    - flat_lab_net

  dockflare-redis:
    labels:
    - glance.hide=true
    image: redis:7-alpine
    container_name: dockflare-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
    - flat_lab_net

  docker-socket-proxy:
    labels:
    - glance.hide=true
    image: tecnativa/docker-socket-proxy:v0.4.1
    container_name: docker-socket-proxy
    restart: unless-stopped
    logging:
      driver: "none"
    environment:
    - DOCKER_HOST=unix:///var/run/docker.sock
    - CONTAINERS=1
    - EVENTS=1
    - NETWORKS=1
    - IMAGES=1
    - POST=1
    - PING=1
    - INFO=1
    - EXEC=1
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    networks:
    - flat_lab_net

  languard:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=LAN map
    - homepage.icon=mdi-lan
    - homepage.href=https://languard.${DUCKDNS_DOMAIN:-localhost}
    image: ghcr.io/hillaliy/languard-frontend:latest
    container_name: languard
    restart: unless-stopped
    network_mode: host
    environment:
    - BACKEND_UPSTREAM=127.0.0.1:8000
    - FRONTEND_LISTEN_ADDRESS=:8080
    depends_on:
      languard-backend:
        condition: service_healthy

  languard-scheduler:
    labels:
    - glance.hide=true
    image: ghcr.io/hillaliy/languard-scheduler:latest
    container_name: languard-scheduler
    restart: unless-stopped
    privileged: true
    network_mode: host
    command: ["python", "-u", "manage.py", "run_scheduler", "--run-now"]
    environment:
    - SECRET_KEY=${LANGUARD_SECRET_KEY:?set LANGUARD_SECRET_KEY in .env}
    - ALLOWED_HOSTS=${LANGUARD_ALLOWED_HOSTS:-localhost,127.0.0.1}
    - DB_PATH=/data/db.sqlite3
    - LOG_DIRECTORY=/data/logs
    - STATIC_ROOT=/static
    volumes:
    - ${LANGUARD_DATA:-../services-data/system/languard}:/data
    - ${LANGUARD_STATIC:-../services-data/system/languard/static}:/static
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      languard-backend:
        condition: service_healthy

  languard-backend:
    labels:
    - glance.hide=true
    image: ghcr.io/hillaliy/languard-backend:latest
    container_name: languard-backend
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
    - SECRET_KEY=${LANGUARD_SECRET_KEY:?set LANGUARD_SECRET_KEY in .env}
    - ALLOWED_HOSTS=${LANGUARD_ALLOWED_HOSTS:-localhost,127.0.0.1}
    - BACKEND_LISTEN_PORT=8000
    - DB_PATH=/data/db.sqlite3
    - LOG_DIRECTORY=/data/logs
    - STATIC_ROOT=/static
    volumes:
    - ${LANGUARD_DATA:-../services-data/system/languard}:/data
    - ${LANGUARD_STATIC:-../services-data/system/languard/static}:/static
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.environ.get('BACKEND_LISTEN_PORT', '8000'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/health/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  homelable:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Diagrams
    - homepage.icon=mdi-sitemap
    - homepage.href=https://diagrams.${DUCKDNS_DOMAIN:-localhost}
    image: ghcr.io/pouzor/homelable-frontend:latest
    container_name: diagrams
    restart: unless-stopped
    environment:
    - BACKEND_UPSTREAM=homelable-backend:8000
    ports:
    - "10021:80"
    networks:
    - flat_lab_net

  homelable-backend:
    labels:
    - glance.hide=true
    image: ghcr.io/pouzor/homelable-backend:latest
    container_name: homelable-backend
    restart: unless-stopped
    environment:
    - SECRET_KEY=${HOMELABLE_SECRET_KEY:?set HOMELABLE_SECRET_KEY in .env}
    - SQLITE_PATH=/app/data/homelab.db
    - CORS_ORIGINS=["https://diagrams.${DUCKDNS_DOMAIN:-localhost}"]
    - AUTH_MODE=local
    - AUTH_USERNAME=${HOMELABLE_AUTH_USERNAME:-admin}
    - AUTH_PASSWORD_HASH=${HOMELABLE_AUTH_PASSWORD_HASH:?set HOMELABLE_AUTH_PASSWORD_HASH in .env}
    - SCANNER_RANGES=${HOMELABLE_SCANNER_RANGES:-["192.168.1.0/24"]}
    - MCP_API_KEY=${HOMELABLE_MCP_API_KEY}
    - MCP_SERVICE_KEY=${HOMELABLE_MCP_SERVICE_KEY}
    volumes:
    - ${HOMELABLE_DATA:-../services-data/system/homelable}:/app/data
    cap_add:
    - NET_RAW
    networks:
    - flat_lab_net

  homelable-mcp:
    labels:
    - glance.hide=true
    image: ghcr.io/pouzor/homelable-mcp:latest
    container_name: homelable-mcp
    restart: unless-stopped
    environment:
    - BACKEND_URL=http://homelable-backend:8000
    - MCP_API_KEY=${HOMELABLE_MCP_API_KEY}
    - MCP_SERVICE_KEY=${HOMELABLE_MCP_SERVICE_KEY}
    ports:
    - "10022:8001"
    depends_on:
    - homelable-backend
    networks:
    - flat_lab_net

  scanopy:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Scanner
    - homepage.icon=mdi-radar
    - homepage.href=https://scanopy.${DUCKDNS_DOMAIN:-localhost}
    image: ghcr.io/scanopy/scanopy/server:latest
    container_name: scanopy
    restart: unless-stopped
    environment:
    - SCANOPY_LOG_LEVEL=info
    - SCANOPY_DATABASE_URL=postgresql://postgres:${SCANOPY_DB_PASSWORD}@scanopy-db:5432/scanopy
    - SCANOPY_WEB_EXTERNAL_PATH=/app/static
    - SCANOPY_PUBLIC_URL=https://scanopy.${DUCKDNS_DOMAIN:-localhost}
    - SCANOPY_INTEGRATED_DAEMON_URL=http://host.docker.internal:60073
    volumes:
    - ${SCANOPY_DATA:-../services-data/system/scanopy/data}:/data
    extra_hosts:
    - "host.docker.internal:host-gateway"
    ports:
    - "10023:60072"
    depends_on:
      scanopy-db:
        condition: service_healthy
      scanopy-daemon:
        condition: service_started
    networks:
    - flat_lab_net

  scanopy-daemon:
    labels:
    - glance.hide=true
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: scanopy-daemon
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
    - SCANOPY_LOG_LEVEL=info
    - SCANOPY_SERVER_URL=http://127.0.0.1:10023
    volumes:
    - ${SCANOPY_DAEMON_CONFIG:-../services-data/system/scanopy/daemon}:/root/.config/scanopy/daemon
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  scanopy-db:
    labels:
    - glance.hide=true
    image: postgres:17-alpine
    container_name: scanopy-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=scanopy
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=${SCANOPY_DB_PASSWORD:?set SCANOPY_DB_PASSWORD in .env}
    volumes:
    - ${SCANOPY_DB_DATA:-../services-data/system/scanopy/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - flat_lab_net

  tapmap:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Connection map
    - homepage.icon=mdi-map
    - homepage.href=https://tapmap.${DUCKDNS_DOMAIN:-localhost}
    image: olalie/tapmap:latest
    container_name: tapmap
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
    - TAPMAP_IN_DOCKER=1
    - TAPMAP_PORT=8050
    - TAPMAP_HOST=0.0.0.0
    - TAPMAP_DATA_DIR=/data
    volumes:
    - ${TAPMAP_DATA:-../services-data/system/tapmap}:/data

  kept-db:
    labels:
    - glance.hide=true
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: kept-db
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=${KEPT_DB_SUPERUSER_PASSWORD:-}
    - POSTGRES_DB=kept
    - TZ=UTC
    volumes:
    - kept-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d kept"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
    - flat_lab_net

  kept-bootstrap:
    labels:
    - glance.hide=true
    image: ghcr.io/keptinventory/kept:1.13.1
    container_name: kept-bootstrap
    restart: "no"
    entrypoint: ["kept"]
    command: ["bootstrap"]
    environment:
    - PGHOST=kept-db
    - PGPORT=5432
    - PGUSER=postgres
    - PGDATABASE=kept
    - KEPT_SECRET_KEY=${KEPT_SECRET_KEY:?set KEPT_SECRET_KEY in .env}
    - KEPT_AUTH_SECRET=${KEPT_AUTH_SECRET:?set KEPT_AUTH_SECRET in .env}
    volumes:
    - kept-config:/config
    - kept-owner:/owner
    depends_on:
      kept-db:
        condition: service_healthy
    networks:
    - flat_lab_net

  kept-migrate:
    labels:
    - glance.hide=true
    image: ghcr.io/keptinventory/kept:1.13.1
    container_name: kept-migrate
    restart: "no"
    entrypoint: ["kept"]
    command: ["migrate"]
    environment:
    - KEPT_OWNER_DATABASE_URL=postgres://kept_owner:${KEPT_DB_SUPERUSER_PASSWORD:?set KEPT_DB_SUPERUSER_PASSWORD in .env}@kept-db:5432/kept
    - KEPT_SECRET_KEY=${KEPT_SECRET_KEY:?set KEPT_SECRET_KEY in .env}
    - KEPT_AUTH_SECRET=${KEPT_AUTH_SECRET:?set KEPT_AUTH_SECRET in .env}
    volumes:
    - kept-data:/data
    - kept-config:/config:ro
    - kept-owner:/owner:ro
    depends_on:
      kept-db:
        condition: service_healthy
      kept-bootstrap:
        condition: service_completed_successfully
    networks:
    - flat_lab_net

  kept:
    labels:
    - homepage.group=Development
    - homepage.name=Kept
    - homepage.icon=mdi-book-multiple
    - homepage.href=https://kept.${DUCKDNS_DOMAIN:-localhost}
    image: ghcr.io/keptinventory/kept:1.13.1
    container_name: kept
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
    - KEPT_PUBLIC_URL=https://kept.${DUCKDNS_DOMAIN:-localhost}
    - KEPT_TRUSTED_PROXIES=${KEPT_TRUSTED_PROXIES:-172.29.72.200}
    - KEPT_DATABASE_URL=postgres://kept_app:${KEPT_DB_SUPERUSER_PASSWORD}@kept-db:5432/kept
    - KEPT_AUTH_DATABASE_URL=postgres://kept_auth:${KEPT_DB_SUPERUSER_PASSWORD}@kept-db:5432/kept
    - KEPT_SYSTEM_DATABASE_URL=postgres://kept_system:${KEPT_DB_SUPERUSER_PASSWORD}@kept-db:5432/kept
    - KEPT_SECRET_KEY=${KEPT_SECRET_KEY:?set KEPT_SECRET_KEY in .env}
    - KEPT_AUTH_SECRET=${KEPT_AUTH_SECRET:?set KEPT_AUTH_SECRET in .env}
    - KEPT_DB_APP_PASSWORD_FILE=/config/database/kept_app
    - KEPT_DB_AUTH_PASSWORD_FILE=/config/database/kept_auth
    - KEPT_DB_SYSTEM_PASSWORD_FILE=/config/database/kept_system
    volumes:
    - kept-data:/data
    - kept-config:/config
    depends_on:
      kept-db:
        condition: service_healthy
      kept-migrate:
        condition: service_completed_successfully
    networks:
    - flat_lab_net

  lantern:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Wake-on-LAN
    - homepage.icon=mdi-power
    - homepage.href=https://wol.${DUCKDNS_DOMAIN:-localhost}
    image: lantern:local
    build:
      context: ${LANTERN_SOURCE:-./src/containers/LANtern}
    container_name: lantern
    restart: unless-stopped
    profiles: ["build-only"]
    network_mode: host
    environment:
    - PORT=${LANTERN_PORT:-3000}
    - DEVICES_FILE=/config/devices.json
    - CONFIG_FILE=/config/config.json
    volumes:
    - ${LANTERN_CONFIG:-../services-data/system/lantern}:/config

  rackdaddy:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=RackDaddy
    - homepage.icon=mdi-server
    - homepage.href=https://rack.${DUCKDNS_DOMAIN:-localhost}
    image: rackdaddy:local
    build:
      context: ${RACKDADDY_SOURCE:-./upstream/RackDaddy-Lab}
    container_name: rack
    restart: unless-stopped
    profiles: ["build-only"]
    environment:
    - APP_NAME=RackDaddy
    - DATABASE_URL=postgresql://rackdaddy:${RACKDADDY_DB_PASSWORD:?set RACKDADDY_DB_PASSWORD in .env}@rackdaddy-db:5432/rackdaddy
    - PORT=3002
    - NODE_ENV=production
    - SITE_DEFAULT=MAIN
    - SITE_NAME=Lab
    - SITES_REGISTRY_FILE=/app/uploads/sites.json
    - LOCAL_USERS_FILE=/app/uploads/users.json
    - API_TOKENS_FILE=/app/uploads/api-tokens.json
    - LOCAL_AUTH_USER=${RACKDADDY_AUTH_USER:-admin}
    - LOCAL_AUTH_PASSWORD_HASH=${RACKDADDY_AUTH_PASSWORD_HASH:?set RACKDADDY_AUTH_PASSWORD_HASH in .env}
    - LOCAL_AUTH_SECRET=${RACKDADDY_AUTH_SECRET:?set RACKDADDY_AUTH_SECRET in .env}
    - LOCAL_AUTH_ROLE=admin
    volumes:
    - rackdaddy-uploads:/app/uploads
    - rackdaddy-devicetype-library:/opt/devicetype-library
    depends_on:
      rackdaddy-db:
        condition: service_healthy
    ports:
    - "10066:3002"
    networks:
    - flat_lab_net

  rackdaddy-frontend:
    labels:
    - glance.hide=true
    image: rackdaddy-frontend:local
    build:
      context: ${RACKDADDY_SOURCE:-./upstream/RackDaddy-Lab}
      dockerfile: client/Dockerfile
    container_name: rackdaddy-frontend
    restart: unless-stopped
    profiles: ["build-only"]
    depends_on:
    - rackdaddy
    ports:
    - "10067:80"
    networks:
    - flat_lab_net

  rackdaddy-db:
    labels:
    - glance.hide=true
    image: postgres:16-alpine
    container_name: rackdaddy-db
    restart: unless-stopped
    profiles: ["build-only"]
    environment:
    - POSTGRES_DB=rackdaddy
    - POSTGRES_USER=rackdaddy
    - POSTGRES_PASSWORD=${RACKDADDY_DB_PASSWORD:?set RACKDADDY_DB_PASSWORD in .env}
    volumes:
    - rackdaddy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rackdaddy -d rackdaddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - flat_lab_net

networks:
  flat_lab_net:
    name: flat_lab_net
    external: true

volumes:
  kept-db: {}
  kept-data: {}
  kept-config: {}
  kept-owner: {}
  rackdaddy-uploads: {}
  rackdaddy-devicetype-library: {}
  rackdaddy-pgdata: {}
