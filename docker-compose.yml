services:
  zerotier-init:
    image: alpine:latest
    container_name: zerotier-init
    restart: "no"
    volumes:
    - ${ZEROTIER_DATA_PATH:-../services-data/system/zerotier}:/var/lib/zerotier-one
    entrypoint: /bin/sh
    command:
    - -c
    - |
      if [ ! -f /var/lib/zerotier-one/local.conf ]; then
        echo "Configuring zerotier-one to listen on all interfaces..."
        printf '{"settings":{"tcpListenAddress":"0.0.0.0:9993"}}\n' > /var/lib/zerotier-one/local.conf
        echo "local.conf written."
      else
        echo "local.conf already exists. Skipping."
      fi

  zerotier:
    build:
      context: ./src/containers/zerotier
      dockerfile: Dockerfile
    container_name: zerotier
    restart: unless-stopped
    labels:
    - glance.hide=true
    cap_add:
    - NET_ADMIN
    - SYS_ADMIN
    devices:
    - /dev/net/tun
    volumes:
    - ${ZEROTIER_DATA_PATH:-../services-data/system/zerotier}:/var/lib/zerotier-one
    environment:
    - ZEROTIER_NETWORK_ID=${ZEROTIER_NETWORK_ID:?set ZEROTIER_NETWORK_ID in .env}
    networks:
    - flat_lab_net
    depends_on:
      zerotier-init:
        condition: service_completed_successfully

  caddy:
    labels:
    - glance.hide=true
    build:
      context: ./src/containers/caddy
      dockerfile: Dockerfile
    container_name: caddy
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    environment:
    - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in .env}
    - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:?set DUCKDNS_DOMAIN in .env}
    volumes:
    - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile
    - ../services-data/system/caddy/data:/data
    - ../services-data/system/caddy/config:/config
    networks:
    - flat_lab_net
    extra_hosts:
    - "host.docker.internal:host-gateway"

  cpm:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Caddy UI
    - homepage.icon=mdi-sign-direction
    - homepage.href=https://caddyui.${DUCKDNS_DOMAIN:-localhost}
    image: perteus/caddy-ui:latest
    container_name: cpm
    restart: unless-stopped
    environment:
    - CONTAINER_NAME=caddy
    - CADDY_CONFIG_PATH=/caddy-config
    - CADDY_DATA_PATH=/caddy-data
    ports:
    - "10056:8501"
    volumes:
    - ./configs/caddy/Caddyfile:/caddy-config/Caddyfile:ro
    - ${CPM_DATA:-../services-data/system/caddy/data}:/caddy-data
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - flat_lab_net

  adguardhome:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=AdGuard
    - homepage.icon=mdi-shield-check
    - homepage.description=DNS sinkhole
    - homepage.href=https://adguard.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=adguard
    - homepage.widget.url=https://adguard.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.username={{HOMEPAGE_VAR_ADGUARD_WIDGET_USERNAME}}
    - homepage.widget.password={{HOMEPAGE_VAR_ADGUARD_WIDGET_PASSWORD}}
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
    - ${ADGUARD_WORKDIR:-../services-data/system/adguardhome/workdir}:/opt/adguardhome/work
    - ${ADGUARD_CONFDIR:-../services-data/system/adguardhome/confdir}:/opt/adguardhome/conf
    ports:
    - "53:53/tcp"
    - "53:53/udp"
    - "10002:81/tcp"
    - "10001:3000/tcp"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${DUCKDNS_DOMAIN:-localhost}
    networks:
    - flat_lab_net

  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    labels:
    - glance.hide=true
    command: hbbs
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21115:21115"
    - "21116:21116"
    - "21116:21116/udp"
    - "21118:21118"
    networks:
    - flat_lab_net

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    command: hbbr
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21117:21117"
    - "21119:21119"
    networks:
    - flat_lab_net

  homepage:
    labels:
    - glance.hide=true
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
    - HOMEPAGE_MCP_TOKEN=${HOMEPAGE_MCP_TOKEN:-}
    - HOMEPAGE_MCP_ENABLED=${HOMEPAGE_MCP_ENABLED:-false}
    - HOMEPAGE_AUTH_ENABLED=${HOMEPAGE_AUTH_ENABLED:-false}
    - HOMEPAGE_MCP_ALLOW_WRITE=${HOMEPAGE_MCP_ALLOW_WRITE:-false}
    - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-homepage.${DUCKDNS_DOMAIN:-localhost},localhost,127.0.0.1}
    # Look & header widgets:
    - HOMEPAGE_VAR_TITLE=${HOMEPAGE_TITLE:-flat-lab}
    - HOMEPAGE_VAR_THEME=${HOMEPAGE_THEME:-dark}
    - HOMEPAGE_VAR_COLOR=${HOMEPAGE_COLOR:-slate}
    - HOMEPAGE_VAR_HEADER_STYLE=${HOMEPAGE_HEADER_STYLE:-boxed}
    - HOMEPAGE_VAR_CARD_STYLE=${HOMEPAGE_CARD_STYLE:-}
    - HOMEPAGE_VAR_BLOCK_STYLE=${HOMEPAGE_BLOCK_STYLE:-}
    - HOMEPAGE_VAR_FONT=${HOMEPAGE_FONT:-}
    - HOMEPAGE_VAR_DOMAIN=${DUCKDNS_DOMAIN}
    - HOMEPAGE_VAR_TZ=${TZ:-Europe/Kyiv}
    - HOMEPAGE_VAR_OPENMETEO_LABEL=${OPENMETEO_LABEL:-Home}
    - HOMEPAGE_VAR_OPENMETEO_LAT=${OPENMETEO_LAT:-50.45}
    - HOMEPAGE_VAR_OPENMETEO_LON=${OPENMETEO_LON:-30.52}
    # Widget credentials:
    - HOMEPAGE_VAR_BESZEL_WIDGET_USERNAME=${BESZEL_WIDGET_USERNAME:-}
    - HOMEPAGE_VAR_BESZEL_WIDGET_PASSWORD=${BESZEL_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_CHANGEDETECTION_WIDGET_KEY=${CHANGEDETECTION_WIDGET_KEY:-}
    - HOMEPAGE_VAR_KARAKEEP_WIDGET_KEY=${KARAKEEP_WIDGET_KEY:-}
    - HOMEPAGE_VAR_ADGUARD_WIDGET_USERNAME=${ADGUARD_WIDGET_USERNAME:-admin}
    - HOMEPAGE_VAR_ADGUARD_WIDGET_PASSWORD=${ADGUARD_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_HOMEASSISTANT_WIDGET_KEY=${HOMEASSISTANT_WIDGET_KEY:-}
    - HOMEPAGE_VAR_NTFY_WIDGET_USERNAME=${NTFY_WIDGET_USERNAME:-}
    - HOMEPAGE_VAR_NTFY_WIDGET_PASSWORD=${NTFY_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_CALIBRE_WIDGET_USER=${CALIBRE_WIDGET_USER:-admin}
    - HOMEPAGE_VAR_CALIBRE_WIDGET_PASSWORD=${CALIBRE_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_HOMEBOX_WIDGET_USERNAME=${HOMEBOX_WIDGET_USERNAME:-}
    - HOMEPAGE_VAR_HOMEBOX_WIDGET_PASSWORD=${HOMEBOX_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_IMMICH_WIDGET_KEY=${IMMICH_WIDGET_KEY:-}
    - HOMEPAGE_VAR_JELLYFIN_WIDGET_KEY=${JELLYFIN_WIDGET_KEY:-}
    - HOMEPAGE_VAR_KAVITA_WIDGET_USER=${KAVITA_WIDGET_USER:-admin}
    - HOMEPAGE_VAR_KAVITA_WIDGET_PASSWORD=${KAVITA_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_LIDARR_WIDGET_KEY=${LIDARR_WIDGET_KEY:-}
    - HOMEPAGE_VAR_LINKWARDEN_WIDGET_KEY=${LINKWARDEN_WIDGET_KEY:-}
    - HOMEPAGE_VAR_MINIFLUX_WIDGET_KEY=${MINIFLUX_WIDGET_KEY:-}
    - HOMEPAGE_VAR_NAVIDROME_WIDGET_USER=${NAVIDROME_WIDGET_USER:-admin}
    - HOMEPAGE_VAR_NAVIDROME_WIDGET_TOKEN=${NAVIDROME_WIDGET_TOKEN:-}
    - HOMEPAGE_VAR_NAVIDROME_WIDGET_SALT=${NAVIDROME_WIDGET_SALT:-}
    - HOMEPAGE_VAR_PAPERLESS_WIDGET_KEY=${PAPERLESS_WIDGET_KEY:-}
    - HOMEPAGE_VAR_PROWLARR_WIDGET_KEY=${PROWLARR_WIDGET_KEY:-}
    - HOMEPAGE_VAR_QBITTORRENT_WIDGET_USER=${QBITTORRENT_WIDGET_USER:-admin}
    - HOMEPAGE_VAR_QBITTORRENT_WIDGET_PASSWORD=${QBITTORRENT_WIDGET_PASSWORD:-}
    - HOMEPAGE_VAR_RADARR_WIDGET_KEY=${RADARR_WIDGET_KEY:-}
    - HOMEPAGE_VAR_SONARR_WIDGET_KEY=${SONARR_WIDGET_KEY:-}
    - HOMEPAGE_VAR_WALLOS_WIDGET_KEY=${WALLOS_WIDGET_KEY:-}
    ports:
    - "10000:3000"
    volumes:
    - ../services-data/system/homepage/config:/app/config
    - ./configs/homepage/docker.yaml:/app/config/docker.yaml:ro
    - ./configs/homepage/settings.yaml:/app/config/settings.yaml:ro
    - ./configs/homepage/widgets.yaml:/app/config/widgets.yaml:ro
    - ./configs/homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
    - ./configs/homepage/themes/${HOMEPAGE_THEME_PRESET:-default}.css:/app/config/custom.css:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - flat_lab_net
    extra_hosts:
    - "host.docker.internal:host-gateway"

  searxng:
    labels:
    - homepage.group=Household
    - homepage.name=Search
    - homepage.icon=mdi-magnify
    - homepage.href=https://search.${DUCKDNS_DOMAIN:-localhost}
    image: searxng/searxng:latest
    container_name: search
    restart: unless-stopped
    environment:
    - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    - SEARXNG_REDIS_URL=redis://searxng-redis:6379/0
    ports:
    - "10003:8080"
    volumes:
    - ./configs/searxng:/etc/searxng
    dns:
    - "${DNS1:-}"
    - "${DNS2:-}"
    networks:
    - flat_lab_net

  searxng-redis:
    image: redis:7-alpine
    container_name: searxng-redis
    restart: unless-stopped
    volumes:
    - ${SEARXNG_REDIS_DATA:-../services-data/system/searxng/redis}:/data
    networks:
    - flat_lab_net

  filebrowser-quantum:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Files
    - homepage.icon=si-filebrowser
    - homepage.href=https://files.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=filebrowser
    - homepage.widget.url=http://filebrowser-quantum:80
    image: gtstef/filebrowser:2.0.1-stable
    container_name: files
    restart: unless-stopped
    environment:
    - FILEBROWSER_CONFIG=/config/config.yaml
    ports:
    - "10005:80"
    volumes:
    - ${FILEBROWSER_DATA:-../services-data/system/filebrowser-quantum}:/config
    - ./configs/filebrowser-quantum/config.yaml:/config/config.yaml:ro
    - ${FILEBROWSER_FILES:-../services-data/public}:/public
    networks:
    - flat_lab_net

  glances:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Monitor
    - homepage.icon=mdi-monitor-eye
    - homepage.href=https://monitor.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=glances
    - homepage.widget.url=http://monitor:61208
    - homepage.widget.version=4
    - homepage.widget.metric=info
    image: nicolargo/glances:latest
    container_name: monitor
    restart: unless-stopped
    pid: host
    privileged: true
    environment:
    - GLANCES_OPT=-w
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ${GLANCES_DATA_PATH:-../services-data/system/glances}:/glances/conf
    ports:
    - "10006:61208"
    networks:
    - flat_lab_net

  tapmap:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Connections
    - homepage.icon=mdi-map
    - homepage.href=https://connections.${DUCKDNS_DOMAIN:-localhost}
    image: olalie/tapmap:latest
    container_name: tapmap
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
    - TAPMAP_IN_DOCKER=1
    - TAPMAP_PORT=8050
    - TAPMAP_HOST=0.0.0.0
    - TAPMAP_DATA_DIR=/data
    volumes:
    - ${TAPMAP_DATA:-../services-data/system/tapmap}:/data

  scanopy:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Networks
    - homepage.icon=mdi-radar
    - homepage.href=https://networks.${DUCKDNS_DOMAIN:-localhost}
    image: ghcr.io/scanopy/scanopy/server:latest
    container_name: networks
    restart: unless-stopped
    environment:
    - SCANOPY_LOG_LEVEL=info
    - SCANOPY_DATABASE_URL=postgresql://postgres:${SCANOPY_DB_PASSWORD}@scanopy-db:5432/scanopy
    - SCANOPY_WEB_EXTERNAL_PATH=/app/static
    - SCANOPY_PUBLIC_URL=https://networks.${DUCKDNS_DOMAIN:-localhost}
    - SCANOPY_INTEGRATED_DAEMON_URL=http://host.docker.internal:60073
    volumes:
    - ${SCANOPY_DATA:-../services-data/system/scanopy/data}:/data
    extra_hosts:
    - "host.docker.internal:host-gateway"
    ports:
    - "10023:60072"
    depends_on:
      scanopy-db:
        condition: service_healthy
      scanopy-daemon:
        condition: service_started
    networks:
    - flat_lab_net

  scanopy-daemon:
    labels:
    - glance.hide=true
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: networks-daemon
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
    - SCANOPY_LOG_LEVEL=info
    - SCANOPY_SERVER_URL=http://127.0.0.1:10023
    volumes:
    - ${SCANOPY_DAEMON_CONFIG:-../services-data/system/scanopy/daemon}:/root/.config/scanopy/daemon
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  scanopy-db:
    labels:
    - glance.hide=true
    image: postgres:17-alpine
    container_name: networks-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=scanopy
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=${SCANOPY_DB_PASSWORD:?set SCANOPY_DB_PASSWORD in .env}
    volumes:
    - ${SCANOPY_DB_DATA:-../services-data/system/scanopy/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - flat_lab_net

  home-assistant:
    labels:
    - homepage.group=Household
    - homepage.name=Home Assistant
    - homepage.icon=mdi-home-automation
    - homepage.href=https://home-assistant.${DUCKDNS_DOMAIN:-localhost}
    - homepage.widget.type=homeassistant
    - homepage.widget.url=http://host.docker.internal:8123
    - homepage.widget.key={{HOMEPAGE_VAR_HOMEASSISTANT_WIDGET_KEY}}
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    privileged: true
    network_mode: host
    cap_add:
    - NET_ADMIN
    - NET_RAW
    volumes:
    - ${HOME_ASSISTANT_DATA:-../services-data/system/home-assistant}:/config
    - ./configs/home-assistant/configuration.yaml:/config/configuration.yaml:ro
    - /etc/localtime:/etc/localtime:ro
    - /run/dbus:/run/dbus:ro
    environment:
    - TZ=${TZ:-Europe/Kyiv}

  kept:
    labels:
    - homepage.group=Household
    - homepage.name=Kept
    - homepage.icon=mdi-book-multiple
    - homepage.href=https://kept.${DUCKDNS_DOMAIN:-localhost}
    image: ghcr.io/keptinventory/kept:1.13.1
    container_name: kept
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
    - KEPT_PUBLIC_URL=https://kept.${DUCKDNS_DOMAIN:-localhost}
    - KEPT_TRUSTED_PROXIES=${KEPT_TRUSTED_PROXIES:-172.29.72.200}
    - KEPT_DATABASE_URL=postgres://kept_app@kept-db:5432/kept
    - KEPT_AUTH_DATABASE_URL=postgres://kept_auth@kept-db:5432/kept
    - KEPT_SYSTEM_DATABASE_URL=postgres://kept_system@kept-db:5432/kept
    - KEPT_SECRET_KEY=${KEPT_SECRET_KEY:?set KEPT_SECRET_KEY in .env}
    - KEPT_AUTH_SECRET=${KEPT_AUTH_SECRET:?set KEPT_AUTH_SECRET in .env}
    - KEPT_DB_APP_PASSWORD_FILE=/config/database/kept_app
    - KEPT_DB_AUTH_PASSWORD_FILE=/config/database/kept_auth
    - KEPT_DB_SYSTEM_PASSWORD_FILE=/config/database/kept_system
    volumes:
    - kept-data:/data
    - kept-config:/config
    depends_on:
      kept-db:
        condition: service_healthy
      kept-migrate:
        condition: service_completed_successfully
    networks:
    - flat_lab_net

  kept-db:
    labels:
    - glance.hide=true
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: kept-db
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=${KEPT_DB_SUPERUSER_PASSWORD:-}
    - POSTGRES_DB=kept
    - TZ=UTC
    volumes:
    - kept-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d kept"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
    - flat_lab_net

  kept-bootstrap:
    labels:
    - glance.hide=true
    image: ghcr.io/keptinventory/kept:1.13.1
    container_name: kept-bootstrap
    restart: "no"
    entrypoint: ["kept"]
    command: ["bootstrap"]
    environment:
    - PGHOST=kept-db
    - PGPORT=5432
    - PGUSER=postgres
    - PGDATABASE=kept
    - PGPASSWORD=${KEPT_DB_SUPERUSER_PASSWORD:?set KEPT_DB_SUPERUSER_PASSWORD in .env}
    - KEPT_SECRET_KEY=${KEPT_SECRET_KEY:?set KEPT_SECRET_KEY in .env}
    - KEPT_AUTH_SECRET=${KEPT_AUTH_SECRET:?set KEPT_AUTH_SECRET in .env}
    - KEPT_DB_OWNER_PASSWORD_FILE=/owner/kept_owner
    - KEPT_DB_APP_PASSWORD_FILE=/config/database/kept_app
    - KEPT_DB_AUTH_PASSWORD_FILE=/config/database/kept_auth
    - KEPT_DB_SYSTEM_PASSWORD_FILE=/config/database/kept_system
    volumes:
    - kept-config:/config
    - kept-owner:/owner
    depends_on:
      kept-db:
        condition: service_healthy
    networks:
    - flat_lab_net

  kept-migrate:
    labels:
    - glance.hide=true
    image: ghcr.io/keptinventory/kept:1.13.1
    container_name: kept-migrate
    restart: "no"
    entrypoint: ["kept"]
    command: ["migrate"]
    environment:
    - KEPT_OWNER_DATABASE_URL=postgres://kept_owner@kept-db:5432/kept
    - KEPT_DB_OWNER_PASSWORD_FILE=/owner/kept_owner
    - KEPT_SECRET_KEY=${KEPT_SECRET_KEY:?set KEPT_SECRET_KEY in .env}
    - KEPT_AUTH_SECRET=${KEPT_AUTH_SECRET:?set KEPT_AUTH_SECRET in .env}
    volumes:
    - kept-data:/data
    - kept-config:/config:ro
    - kept-owner:/owner:ro
    depends_on:
      kept-db:
        condition: service_healthy
      kept-bootstrap:
        condition: service_completed_successfully
    networks:
    - flat_lab_net

networks:
  flat_lab_net:
    name: flat_lab_net
    external: true

volumes:
  kept-db: {}
  kept-data: {}
  kept-config: {}
  kept-owner: {}
