
defaults:
  maps:
    tick_params:
      axis: both
      which: both
      bottom: false
      top: false
      left: false
      right: false
      labelbottom: false
      labelleft: false

    aspect:
      aspect: equal
      adjustable: datalim

    grid:
      visible: false

    spines:
      top: true
      right: true
      bottom: true
      left: true

    facecolor: [1, 1, 1, 1]

    title_style:
      family: Unica One
      size: 30

    adjust_text:
      force_static: 400
      force_texts: 200
      force_explode: 1
      time_lim: 1.0
      ensure_inside_axes: true
      pull_threshold: 100

    center:
      name: Sun
      command: 500@0
      marker_style:
        color: yellow
        s: 100
      label_style: null

  objects:

    trajectory_past:
      enabled: true
      style:
        color: '0.8'
        linewidth: 1

    trajectory_future:
      enabled: false
      style:
        color: '0.8'
        linestyle: "--"

    label_style:
      family: Roboto Mono
      ha: "center"
      va: "top"

    marker_style:
      color: black
      edgecolors: black
      s: 50
      zorder: 999

definitions:

    inner_planets: &inner_planet_default
      ephemeris_file:
        minimum_ephemeris_request:
          time_step: 1 day
          start_epoch: "-120 days"
          stop_epoch: "30 days"
        max_interpolation_interval: 2 days
        cache_expiration_time: 10 days
      trajectory_past:
        duration: 80D
        time_step: 1 days
      trajectory_future:
        enabled: false

    outer_planets: &outer_planet_default
      ephemeris_file:
        minimum_ephemeris_request:
          time_step: 50 days
          start_epoch: "-4500 days"
          stop_epoch: "100 days"
        max_interpolation_interval: 100 days
        cache_expiration_time: 10 days
      trajectory_past:
        duration: 4000 days
        time_step: 50 days
      trajectory_future:
        enabled: false

    moons: &moon_default
      ephemeris_file:
        minimum_ephemeris_request:
          time_step: 1 hour
          start_epoch: "-20 days"
          stop_epoch: "20 days"
        max_interpolation_interval: 1 hour
        cache_expiration_time: 10 days
      trajectory_past:
        duration: 1 days
        time_step: 1 hour
      trajectory_future:
        enabled: false
      marker_style:
        color: black
        s: 30


title:
  text: MOONS
  style:
    family: Unica One
    size: 60

figure:
  figsize: [19.2, 10.80]
  dpi: 100

gridspec:
  ncols: 3
  nrows: 2
  hspace: 0.02
  wspace: 0.02
  left: 0.02
  right: 0.98
  top: 0.9
  bottom: 0.02

maps:

  - gridspec:
      rows: "0:1"
      columns: "0:1"
    axis:
      xlim: [-400000, 400000]
      ylim: [-400000, 400000]

    center:
      name: Earth
      command: 500@3
      marker_style:
        color: blue
        s: 50
      label_style: null
    objects:
      - name: Moon
        command: '301'
        <<: *moon_default

  - gridspec:
      rows: "0:1"
      columns: "1:2"
    aspect:
      aspect: equal
      adjustable: datalim
    center:
      name: Mars
      command: 500@4
      marker_style:
        color: lightcoral
        s: 50
      label_style: null
    objects:
      - name: Phobos
        command: '401'
        <<: *moon_default
        ephemeris_file:
          max_interpolation_interval: 1 min
        trajectory_past:
          duration: 5 hours
          time_step: 3 minutes
      - name: Deimos
        command: '402'
        <<: *moon_default
        ephemeris_file:
          max_interpolation_interval: 1 min
        trajectory_past:
          duration: 5 hours
          time_step: 3 minutes

  - gridspec:
      rows: "0:1"
      columns: "2:3"
    aspect:
      aspect: equal
      adjustable: datalim
    center:
      name: Jupiter
      command: 500@5
      marker_style:
        ignore_defaults: True
        marker: +

    objects:
      - name: Jupiter
        <<: *moon_default
        command: '599'
        trajectory_past:
          duration: 20 days
          time_step: 1 days
        trajectory_future:
          enabled: false
        label_style: null
        marker_style:
          color: salmon
          s: 50
      - name: Ganymede
        <<: *moon_default

      - name: Io
        command: '501'
        <<: *moon_default

      - name: Europa
        <<: *moon_default
        command: '502'
        trailing_days: 1

      - name: Callisto
        command: '504'
        <<: *moon_default

  - gridspec:
      rows: "1:2"
      columns: "0:1"
    aspect:
      aspect: equal
      adjustable: datalim
    center:
      name: Saturn
      command: "500@6"
      marker_style:
        ignore_defaults: true
        marker: +

    objects:
      - name: Saturn
        <<: *moon_default
        command: '699'
        trajectory_past:
          duration: 20 days
          time_step: 1 days
        trajectory_future:
          enabled: false
        label_style: null
        marker_style:
          color: navajowhite
          s: 50
      - name: Titan
        <<: *moon_default
        command: "606"
      - name: Rhea
        <<: *moon_default
        command: "605"
      - name: Dione
        <<: *moon_default
        command: "604"
      - name: Enceladus
        <<: *moon_default
        command: "602"

  - gridspec:
      rows: "1:2"
      columns: "1:2"
    aspect:
      aspect: equal
      adjustable: datalim
    center:
      name: Uranus
      command: "500@7"
      marker_style:
        ignore_defaults: true
        marker: +
    objects:
      - name: Uranus
        <<: *moon_default
        command: '799'
        trajectory_past:
          duration: 20 days
          time_step: 1 days
        trajectory_future:
          enabled: false
        label_style: null
        marker_style:
          color: mediumaquamarine
          s: 50
      - name: Miranda
        <<: *moon_default
        command: "705"
      - name: Ariel
        <<: *moon_default
        command: "701"
      - name: Umbriel
        <<: *moon_default
        command: "702"
      - name: Titania
        <<: *moon_default
        command: "703"
      - name: Oberon
        <<: *moon_default
        command: "704"

  - gridspec:
      rows: "1:2"
      columns: "2:3"
    center:
      name: Neptune
      command: "500@8"
      marker_style:
        ignore_defaults: true
        marker: +
    objects:
      - name: Neptune
        <<: *moon_default
        command: '899'
        trajectory_past:
          duration: 20 days
          time_step: 1 days
        trajectory_future:
          enabled: false
        label_style: null
        marker_style:
          color: paleturquoise
          s: 50
      - name: Triton
        <<: *moon_default
        command: "801"
      - name: Proteus
        <<: *moon_default
        command: "808"
