services:

  tapmap:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Connections
    - homepage.icon=mdi-map
    - homepage.href=https://connections.${DUCKDNS_DOMAIN:-localhost}
    image: olalie/tapmap:latest
    container_name: tapmap
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
    - TAPMAP_IN_DOCKER=1
    - TAPMAP_PORT=8050
    - TAPMAP_HOST=0.0.0.0
    - TAPMAP_DATA_DIR=/data
    volumes:
    - ${TAPMAP_DATA:-../services-data/system/tapmap}:/data

  lantern:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Wake-on-LAN
    - homepage.icon=mdi-power
    - homepage.href=https://wol.${DUCKDNS_DOMAIN:-localhost}
    image: lantern:local
    build:
      context: ./src/containers/LANtern
      dockerfile: Dockerfile
    container_name: lantern
    restart: unless-stopped
    profiles: ["build-only"]
    network_mode: host
    environment:
    - PORT=${LANTERN_PORT:-3000}
    - DEVICES_FILE=/config/devices.json
    - CONFIG_FILE=/config/config.json
    volumes:
    - ${LANTERN_CONFIG:-../services-data/system/lantern}:/config

  # netalertx:
  #   labels:
  #   - homepage.group=Infrastructure
