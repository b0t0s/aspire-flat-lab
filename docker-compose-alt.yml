  #   - ${NETALERTX_DATA_PATH:-../services-data/system/netalertx}:/data

  languard:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=LAN map
    - homepage.icon=mdi-lan
    - homepage.href=https://languard.${DUCKDNS_DOMAIN:-localhost}
    image: ghcr.io/hillaliy/languard-frontend:latest
    container_name: languard
    restart: unless-stopped
    network_mode: host
    environment:
    - BACKEND_UPSTREAM=127.0.0.1:8000
    - FRONTEND_LISTEN_ADDRESS=:8080
    depends_on:
      languard-backend:
        condition: service_healthy

  languard-scheduler:
    labels:
    - glance.hide=true
    image: ghcr.io/hillaliy/languard-scheduler:latest
    container_name: languard-scheduler
    restart: unless-stopped
    privileged: true
    network_mode: host
    command: ["python", "-u", "manage.py", "run_scheduler", "--run-now"]
    environment:
    - SECRET_KEY=${LANGUARD_SECRET_KEY:?set LANGUARD_SECRET_KEY in .env}
    - ALLOWED_HOSTS=${LANGUARD_ALLOWED_HOSTS:-localhost,127.0.0.1}
    - DB_PATH=/data/db.sqlite3
    - LOG_DIRECTORY=/data/logs
    - STATIC_ROOT=/static
    volumes:
    - ${LANGUARD_DATA:-../services-data/system/languard}:/data
    - ${LANGUARD_STATIC:-../services-data/system/languard/static}:/static
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      languard-backend:
        condition: service_healthy

  languard-backend:
    labels:
    - glance.hide=true
    image: ghcr.io/hillaliy/languard-backend:latest
    container_name: languard-backend
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
    - SECRET_KEY=${LANGUARD_SECRET_KEY:?set LANGUARD_SECRET_KEY in .env}
    - ALLOWED_HOSTS=${LANGUARD_ALLOWED_HOSTS:-localhost,127.0.0.1}
    - BACKEND_LISTEN_PORT=8000
    - DB_PATH=/data/db.sqlite3
    - LOG_DIRECTORY=/data/logs
    - STATIC_ROOT=/static
    volumes:
    - ${LANGUARD_DATA:-../services-data/system/languard}:/data
    - ${LANGUARD_STATIC:-../services-data/system/languard/static}:/static
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.environ.get('BACKEND_LISTEN_PORT', '8000'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/health/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

