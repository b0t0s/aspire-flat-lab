<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMPP Web Chat</title>
    <link rel="stylesheet" href="converse.min.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body {
            margin: 0;
            background: #fafafa;
            color: #444;
            font-family: sans-serif;
        }
        #initial-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1em auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="converse-fullscreen">
    <div id="initial-loader">
        <h2>XMPP Web Chat</h2>
        <div class="spinner"></div>
        <p>Loading chat client...</p>
    </div>

    <noscript>
        <h1 style="text-align:center;margin-top:20vh;">XMPP Web Chat requires JavaScript</h1>
    </noscript>

    <script type="module">
        // Remove initial loader once converse renders
        const observer = new MutationObserver(() => {
            const loader = document.getElementById('initial-loader');
            if (loader && document.querySelector('.converse-brand')) {
                loader.remove();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        import { converse } from "./converse.min.js";

        converse.initialize({
            whitelisted_plugins: [],
            auto_login: false,
            authentication: "login",
            discover_connection_methods: false,
            websocket_url: "${XMPP_WS_URL}",
            bosh_service_url: "${XMPP_BOSH_URL}",
            keepalive: true,
            message_archiving: "always",
            muc_show_join_leave: true,
            muc_show_join_leave_messages: true,
            show_desktop_notifications: true,
            show_chat_state_notifications: true,
            theme: "concord",
            view_mode: "overlayed",
            singleton: true,
        });
    </script>
</body>
</html>
